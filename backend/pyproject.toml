authors = [
    { name = "aayushi404", email = "149879937+aayushi404@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.19.1",
    "anthropic>=0.40.0",
    "bcrypt==4.0.1",
    "email-validator>=2.2.0",
    "fastapi>=0.141.1",
    "google-genai>=1.0.0",
    "pgvector>=0.5.0",
    "psycopg2-binary>=2.9.12",
    "pydantic-settings>=2.6.0",
    "pyjwt>=2.13.0",
    "python-dotenv>=1.2.3",
    "sqlalchemy>=2.0.52",
    "sse-starlette>=2.1.0",
    "uvicorn[standard]>=0.52.4",
    "voyageai>=0.3.0",
