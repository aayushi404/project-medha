services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: shiksha-sathi-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: shiksha
      POSTGRES_PASSWORD: shiksha_dev_password
      POSTGRES_DB: shiksha_sathi
    ports:
      - "5431:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shiksha -d shiksha_sathi"]
      interval: 5s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer
    container_name: shiksha-sathi-adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - postgres

volumes:
  postgres_data: