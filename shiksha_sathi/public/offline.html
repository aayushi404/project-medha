<!doctype html>
<html lang="hi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#f8f4ea" />
  <title>Medha — Offline</title>
  <style>
    :root { color-scheme: light dark; --bg: #f8f4ea; --ink: #1f2a44; --muted: #6b6457; --accent: #c8891f; }
    @media (prefers-color-scheme: dark) { :root { --bg: #1d1a16; --ink: #f3efe6; --muted: #b3aa9a; } }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px;
      background: var(--bg); color: var(--ink);
      font-family: system-ui, -apple-system, "Segoe UI", "Noto Sans Devanagari", sans-serif;
    }
    main { max-width: 380px; text-align: center; }
    img { width: 96px; height: 96px; border-radius: 22px; }
    h1 { font-size: 1.35rem; margin: 20px 0 6px; }
    p { margin: 0 0 4px; color: var(--muted); line-height: 1.5; }
    .en { margin-top: 14px; }
    button {
      margin-top: 24px; padding: 12px 28px; border: 0; border-radius: 999px; font: inherit;
      font-weight: 600; background: var(--ink); color: var(--bg); cursor: pointer;
    }
  </style>
</head>
<body>
  <main>
    <img src="/icons/icon-192.png" alt="" />
    <h1>इंटरनेट कनेक्शन नहीं है</h1>
    <p>कृपया नेटवर्क जाँचें और फिर से कोशिश करें।</p>
    <p class="en">You're offline. Check your connection and try again.</p>
    <button type="button" onclick="location.reload()">फिर से कोशिश करें · Retry</button>
  </main>
  <script>window.addEventListener("online", () => location.reload());</script>
</body>
</html>
