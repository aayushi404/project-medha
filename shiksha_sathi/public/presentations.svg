<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F8FAFC"/>
    </linearGradient>

    <linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>

    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#000000" flood-opacity="0.10"/>
    </filter>
  </defs>

  <!-- Back slides -->
  <g transform="rotate(-8 256 256)">
    <rect x="105" y="125" width="270" height="195" rx="18" fill="#E5E7EB"/>
  </g>

  <g transform="rotate(-4 256 256)">
    <rect x="115" y="115" width="270" height="195" rx="18" fill="#F1F5F9"/>
  </g>

  <!-- Main slide -->
  <g filter="url(#softShadow)">
    <rect x="125" y="105" width="270" height="195" rx="18" fill="url(#cardGrad)"/>

    <!-- Header -->
    <rect x="125" y="105" width="270" height="36" rx="18" fill="#F1F5F9"/>
    <rect x="145" y="118" width="140" height="12" rx="6" fill="#D1D5DB"/>

    <!-- LEFT CONTENT (enhanced structure) -->

    <!-- Accent strip -->
    <rect x="145" y="155" width="4" height="60" rx="2" fill="#7C3AED" opacity="0.6"/>

    <!-- Subheading -->
    <rect x="155" y="155" width="90" height="10" rx="5" fill="#A5B4FC" opacity="0.9"/>

    <!-- Bullet row 1 -->
    <circle cx="160" cy="178" r="3" fill="#7C3AED"/>
    <rect x="168" y="172" width="95" height="10" rx="5" fill="#C7D2FE" opacity="0.85"/>

    <!-- Bullet row 2 -->
    <circle cx="160" cy="195" r="3" fill="#7C3AED"/>
    <rect x="168" y="189" width="75" height="10" rx="5" fill="#DDD6FE" opacity="0.85"/>

    <!-- Bullet row 3 -->
    <circle cx="160" cy="212" r="3" fill="#7C3AED"/>
    <rect x="168" y="206" width="105" height="10" rx="5" fill="#C7D2FE" opacity="0.85"/>

    <!-- Right chart -->
    <rect x="265" y="155" width="100" height="80" rx="10" fill="#F8FAFC"/>

    <rect x="275" y="200" width="12" height="25" rx="3" fill="#7C3AED"/>
    <rect x="295" y="185" width="12" height="40" rx="3" fill="#A855F7"/>
    <rect x="315" y="195" width="12" height="30" rx="3" fill="#C4B5FD"/>
    <rect x="335" y="175" width="12" height="50" rx="3" fill="#7C3AED"/>

    <!-- Slide dots -->
    <circle cx="235" cy="280" r="4" fill="#7C3AED"/>
    <circle cx="250" cy="280" r="4" fill="#D1D5DB"/>
    <circle cx="265" cy="280" r="4" fill="#D1D5DB"/>
  </g>

  <!-- Pointer -->
  <g transform="rotate(18 360 250)">
    <rect x="340" y="150" width="14" height="110" rx="7" fill="url(#accentGrad)"/>
    <polygon points="340,150 354,150 347,132" fill="#FACC15"/>
    <rect x="340" y="260" width="14" height="12" rx="4" fill="#E5E7EB"/>
  </g>
</svg>
