name: Build Medha Android APK

on:
  push:
    branches:
      - feat/mobile-app-android
      - mobile-app*
    paths:
      - 'shiksha_sathi/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'shiksha_sathi/package-lock.json'

      - name: Install Node Dependencies
        working-directory: shiksha_sathi
        run: npm ci

      - name: Build Next.js App
        working-directory: shiksha_sathi
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK Licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "platforms;android-35" "platforms;android-36" "build-tools;34.0.0" "build-tools;35.0.0" || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make Gradlew Executable
        run: chmod +x shiksha_sathi/android/gradlew

      - name: Copy Capacitor Assets
        working-directory: shiksha_sathi
        run: npx @capacitor/cli copy android || true

      - name: Build Android Debug APK
        working-directory: shiksha_sathi/android
        run: ./gradlew assembleDebug --stacktrace 2>&1 | tee build.log

      - name: Upload Build Log On Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: shiksha_sathi/android/build.log

      - name: Prepare APK for Upload
        run: |
          mkdir -p apk-output
          find shiksha_sathi/android -name "*.apk" -exec cp {} apk-output/Medha-app-debug.apk \;
          ls -lh apk-output/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Medha-app-debug
          path: apk-output/Medha-app-debug.apk
          if-no-files-found: error
          retention-days: 30
