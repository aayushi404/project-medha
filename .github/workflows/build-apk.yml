name: Build Medha Android APK

on:
  push:
    branches:
      - feat/mobile-app-android
      - mobile-app*
    paths:
      - 'shiksha_sathi/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'shiksha_sathi/package-lock.json'

      - name: Install Node Dependencies
        working-directory: shiksha_sathi
        run: npm ci

      - name: Build Next.js App
        working-directory: shiksha_sathi
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Sync Capacitor Android
        working-directory: shiksha_sathi
        run: npx cap sync android

      - name: Make Gradlew Executable
        run: chmod +x shiksha_sathi/android/gradlew

      - name: Build Android Debug APK
        working-directory: shiksha_sathi/android
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Medha-app-debug
          path: shiksha_sathi/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
