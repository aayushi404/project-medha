<div style="max-width:860px;margin:0 auto;border:0.5px solid var(--border);border-radius:14px;overflow:hidden;background:var(--surface-2);display:flex;min-height:460px">

  <div style="width:210px;border-right:0.5px solid var(--border);display:flex;flex-direction:column;background:var(--surface-1)">
    <div style="padding:16px 14px;display:flex;align-items:center;gap:8px;border-bottom:0.5px solid var(--border)">
      <i class="ti ti-book-2" style="font-size:19px;color:var(--text-accent)" aria-hidden="true"></i>
      <span style="font-size:14px;font-weight:500">Medha</span>
    </div>
    <div style="flex:1;padding:12px 10px;display:flex;flex-direction:column;gap:4px">
      <div style="padding:9px 10px;border-radius:8px;font-size:13px;color:var(--text-secondary);display:flex;align-items:center;gap:9px">
        <i class="ti ti-home" style="font-size:16px" aria-hidden="true"></i>Home
      </div>
      <div style="padding:9px 10px;border-radius:8px;background:var(--bg-accent);color:var(--text-accent);font-size:13px;display:flex;align-items:center;gap:9px">
        <i class="ti ti-folder" style="font-size:16px" aria-hidden="true"></i>My Kits
      </div>
    </div>
    <div style="padding:10px;border-top:0.5px solid var(--border)">
      <div style="padding:8px 9px;border-radius:9px;background:var(--surface-2);border:0.5px solid var(--border);display:flex;align-items:center;gap:9px">
        <div style="width:28px;height:28px;border-radius:50%;background:var(--bg-accent);color:var(--text-accent);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:500;flex-shrink:0">RK</div>
        <div style="min-width:0;flex:1">
          <div style="font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">Ramesh Kumar</div>
          <div style="font-size:10.5px;color:var(--text-muted)">Science · Class 8</div>
        </div>
        <i class="ti ti-chevron-up" style="font-size:14px;color:var(--text-muted)" aria-hidden="true"></i>
      </div>
    </div>
  </div>

  <div style="flex:1;display:flex;flex-direction:column">
    <div style="padding:16px 20px 12px;border-bottom:0.5px solid var(--border)">
      <div style="font-size:15px;margin-bottom:11px">My Kits</div>
      <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
        <div style="border-radius:20px;padding:5px 12px;font-size:12px;background:var(--bg-accent);color:var(--text-accent)">All</div>
        <div style="border:0.5px solid var(--border-strong);border-radius:20px;padding:5px 12px;font-size:12px;color:var(--text-secondary)">Class 6</div>
        <div style="border:0.5px solid var(--border-strong);border-radius:20px;padding:5px 12px;font-size:12px;color:var(--text-secondary)">Class 7</div>
        <div style="border:0.5px solid var(--border-strong);border-radius:20px;padding:5px 12px;font-size:12px;color:var(--text-secondary)">Class 8</div>
        <div style="border:0.5px solid var(--border-strong);border-radius:20px;padding:5px 12px;font-size:12px;color:var(--text-secondary)">Class 9</div>
        <div style="margin-left:auto;border:0.5px solid var(--border-strong);border-radius:8px;padding:5px 10px;font-size:12px;color:var(--text-muted);display:flex;align-items:center;gap:6px">
          <i class="ti ti-search" style="font-size:14px" aria-hidden="true"></i>Search
        </div>
      </div>
    </div>

    <div style="flex:1;padding:16px 20px;display:flex;flex-direction:column;gap:18px;overflow:auto">

      <div>
        <div style="font-size:11.5px;color:var(--text-muted);margin-bottom:8px;letter-spacing:0.02em">CLASS 8 · SCIENCE</div>
        <div style="display:flex;flex-direction:column;gap:8px">
          <div style="border:0.5px solid var(--border);border-radius:10px;padding:12px 14px;background:var(--surface-1);display:flex;align-items:center;gap:12px">
            <div style="flex:1;min-width:0">
              <div style="font-size:13px;margin-bottom:4px">Photosynthesis</div>
              <div style="display:flex;gap:6px;flex-wrap:wrap">
                <span style="font-size:10.5px;border:0.5px solid var(--border-strong);border-radius:5px;padding:2px 6px;color:var(--text-secondary)">PPT</span>
                <span style="font-size:10.5px;border:0.5px solid var(--border-strong);border-radius:5px;padding:2px 6px;color:var(--text-secondary)">Quiz</span>
                <span style="font-size:10.5px;border:0.5px solid var(--border-strong);border-radius:5px;padding:2px 6px;color:var(--text-secondary)">Activity</span>
              </div>
            </div>
            <div style="font-size:11px;color:var(--text-muted);white-space:nowrap">2 din pehle</div>
            <i class="ti ti-download" style="font-size:16px;color:var(--text-muted)" aria-hidden="true"></i>
          </div>
          <div style="border:0.5px solid var(--border);border-radius:10px;padding:12px 14px;background:var(--surface-1);display:flex;align-items:center;gap:12px">
            <div style="flex:1;min-width:0">
              <div style="font-size:13px;margin-bottom:4px">Force and Pressure</div>
              <div style="display:flex;gap:6px">
                <span style="font-size:10.5px;border:0.5px solid var(--border-strong);border-radius:5px;padding:2px 6px;color:var(--text-secondary)">Mindmap</span>
                <span style="font-size:10.5px;border:0.5px solid var(--border-strong);border-radius:5px;padding:2px 6px;color:var(--text-secondary)">Activity</span>
              </div>
            </div>
            <div style="font-size:11px;color:var(--text-muted);white-space:nowrap">5 din pehle</div>
            <i class="ti ti-download" style="font-size:16px;color:var(--text-muted)" aria-hidden="true"></i>
          </div>
        </div>
      </div>

      <div>
        <div style="font-size:11.5px;color:var(--text-muted);margin-bottom:8px;letter-spacing:0.02em">CLASS 7 · SCIENCE</div>
        <div style="border:0.5px solid var(--border);border-radius:10px;padding:12px 14px;background:var(--surface-1);display:flex;align-items:center;gap:12px">
          <div style="flex:1;min-width:0">
            <div style="font-size:13px;margin-bottom:4px">Nutrition in Plants</div>
            <div style="display:flex;gap:6px">
              <span style="font-size:10.5px;border:0.5px solid var(--border-strong);border-radius:5px;padding:2px 6px;color:var(--text-secondary)">PPT</span>
              <span style="font-size:10.5px;border:0.5px solid var(--border-strong);border-radius:5px;padding:2px 6px;color:var(--text-secondary)">Quiz</span>
            </div>
          </div>
          <div style="font-size:11px;color:var(--text-muted);white-space:nowrap">1 hafta pehle</div>
          <i class="ti ti-download" style="font-size:16px;color:var(--text-muted)" aria-hidden="true"></i>
        </div>
      </div>

    </div>
  </div>
</div>
